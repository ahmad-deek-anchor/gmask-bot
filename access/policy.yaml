# Access policy for the GM Slack bot - the STATIC part (roles, tool groups, messages).
#
# Enforced by access/policy.py: loaded at start-up from ACCESS_POLICY_PATH (default this file,
# access/policy.yaml - it lives inside the package so the Cloud Run image always carries it).
# The DYNAMIC part - which users hold which role, which channels the bot answers in, the default
# role and the pause switch - lives in the access store (BigQuery table gmask_bot.access on Cloud
# Run, sqlite data/access.db locally) and is edited from Slack by admins:
#
#   @GM Bot access help
#   @GM Bot access add user @someone desk        roles: viewer, desk, lead, admin, none
#   @GM Bot access add channel here [confidential]
#   @GM Bot access remove user @someone | remove channel here
#   @GM Bot access default viewer | pause | resume | list | whoami
#
# Evaluation order for every Slack event:
#   1. paused (admins exempt)      -> messages.paused, nothing runs
#   2. place                        -> channel must be in the store (admins exempt; DMs per `dms`)
#   3. role                         -> bootstrap_admins, then store, then default role
#   4. tool set                     -> union of the role's tool_groups (inherited); every tool call
#                                      is checked at execution time (the wrapper is the control)
#   5. place sensitivity            -> confidential_groups run only in confidential channels or DMs
#   6. argument rules               -> a few tools branch on an argument (memory scope, snapshot source)
#   7. audit                        -> every denied or confidential call is logged (Cloud Logging)

version: 1
refresh_seconds: 60          # how long the store's rules are cached in the bot

# Always admins, whatever the store says (so access can never be locked out).
bootstrap_admins:
  - U0BP6EUTHA9              # Ahmad Deek

# Role for a user who matches nothing. Decision 2026-09-16 (Ahmad): "viewer" - anyone who can reach
# the bot gets public market data; desk data still needs an explicit role. Admins can change it
# at runtime with `access default <role>`.
default_role: viewer

messages:
  denied_place: "I'm not enabled in this channel yet. An admin can enable it with `access add channel here`, or DM me."
  denied_role: "You're not on the GM bot access list. Ask Ahmad or a GM lead to add you."
  denied_tool: "Not permitted: {tool} needs the {role_needed} role (you have {role}). Tell the user this data is limited to the GM desk and answer with the public data you can access."
  denied_place_tool: "Not permitted: {tool} returns confidential desk data and may only be used in a private desk channel or a DM. Tell the user to ask there."
  paused: "The GM bot is paused for maintenance. Ask Ahmad to resume it."

# ---------------------------------------------------------------------------------------------
# Roles: each inherits the tool groups of the role it names in `inherits`.
# ---------------------------------------------------------------------------------------------
roles:
  viewer:
    description: Public market data, news, sectors, ETF flows, CME, macro; personal memory only.
    tool_groups: [market, live, news, etf, cme, macro, snapshots, memory_personal]

  desk:
    description: >-
      GM desk staff - adds the full report, the desk's own risk, PnL, positions, the spot PnL
      sheet and counterparty-level PnL (decision 2026-09-16 - counterparty PnL sits at desk, not lead).
    inherits: viewer
    tool_groups: [market_heavy, desk_risk, spot_pnl, spot_counterparty]

  lead:
    description: Desk leads - adds raw table access, shared memory and channel rules.
    inherits: desk
    tool_groups: [desk_raw, memory_shared]

  admin:
    description: Ahmad - everything, plus policy changes (via Secret Manager IAM, not the bot).
    inherits: lead
    tool_groups: []

# Groups whose tools return internal positions, PnL, counterparties or raw cells.
confidential_groups: [desk_risk, desk_raw, spot_pnl, spot_counterparty]

# ---------------------------------------------------------------------------------------------
# Tool groups (names are the registered LangChain tool names - see chat.default_tools()).
# ---------------------------------------------------------------------------------------------
tool_groups:
  market:            # Coin Metrics + Amberdata daily data, z-scores, options analytics (Deribit)
    - list_token_universe
    - list_top_assets
    - get_token_metrics
    - get_zscore_signals
    - get_price_history
    - get_multi_day_signals_tool
    - get_options_snapshot
    - get_vol_term_structure
    - get_options_flow
    - get_gamma_exposure
  market_heavy:      # slow / expensive: the full written report (~minutes, many API + model calls)
    - run_full_signals_analysis
  live:              # Coin Metrics live trades, quotes, intraday candles
    - get_live_price
    - get_intraday_candles
    - get_recent_trades
  news:              # Messari news, taxonomy, Intel, social signals
    - get_crypto_news
    - classify_tokens
    - get_sector_members
    - list_crypto_sectors
    - get_intel_events
    - get_social_signals
  etf:               # Messari / Blockworks ETF tables + Coin Metrics on-chain BTC ETF flows
    - get_etf_overview
    - get_etf_flows
    - get_btc_etf_onchain_flows
  cme:               # Coin Metrics CME futures
    - get_cme_curve
    - get_cme_open_interest
  macro:             # FRED + official feeds (US Treasury curve, CBOE VIX)
    - get_macro_snapshot
    - get_fred_series
    - search_fred
    - get_treasury_curve
    - get_vix_history
  snapshots:         # daily snapshot history; the `source` argument decides sensitivity (see argument_rules)
    - get_snapshot_history
    - compare_to_snapshot
    - list_snapshot_metrics
  desk_risk:         # Haruko / BigQuery: positions, greeks, PnL, perps, OTC trades, orders, internal prices
    - get_desk_risk_snapshot
    - get_desk_pnl_history
    - get_derivs_pnl_eod
    - get_desk_greeks_history
    - get_perp_positions
    - get_desk_positions_by_symbol
    - get_otc_derivatives_trades
    - get_open_orders
    - get_internal_price
  desk_raw:          # discovery + arbitrary read-only SQL on the two desk datasets
    - list_desk_tables
    - describe_desk_table
    - query_desk_data
  spot_pnl:          # A1 Metrics Dashboard sheet: HOLD / A1 PnL, take rate, financing fees, client-flow split
    - get_spot_pnl_summary
    - get_weekly_spot_pnl
    - get_financing_fees
    - get_nonclient_pnl
    - get_a1_client_flow_split
    - list_a1_dashboard_tabs
  spot_counterparty: # names counterparties, or dumps raw cells
    - get_counterparty_pnl
    - read_a1_dashboard_range
  memory_personal:   # a user's own memories (scope "me") - the memory store already isolates users
    - remember
    - recall
    - forget
    - what_do_you_remember
  memory_shared:     # desk-wide facts and channel standing instructions
    - set_channel_rule
    - clear_channel_rule

# Tools whose sensitivity depends on an argument. The wrapper checks these after the group check.
argument_rules:
  - tool: remember
    argument: scope
    values: [shared]
    requires_group: memory_shared          # scope "me" stays under memory_personal
  - tool: forget
    argument: scope
    values: [shared]
    requires_group: memory_shared
  - tools: [get_snapshot_history, compare_to_snapshot, list_snapshot_metrics]
    argument: source
    values: [haruko, sheet]
    requires_group: desk_risk               # signals / etf / cme snapshots stay public
    confidential: true                      # and only in confidential places

# ---------------------------------------------------------------------------------------------
# Principals and places are DYNAMIC (access store, edited from Slack). Only the DM behaviour and
# the unlisted-channel rule are fixed here.
# ---------------------------------------------------------------------------------------------
places:
  deny_unlisted_channels: true # a channel not added with `access add channel` gets messages.denied_place
  dms:
    enabled: true
    min_role: viewer
    confidential_allowed: true # a desk-role user may ask for positions in a DM

# Not built yet (kept as the agreed shape): per-user quotas and the BigQuery audit table.
limits:
  per_user_daily_requests: 150
  per_channel_daily_requests: 1000
  exempt_roles: [admin]
audit:
  bigquery_table: anchorage-corp-eng-playground.gmask_bot.audit
  log_arguments: redacted
